<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5S Numbers Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="app-header">
      <h1>5S Numbers Game</h1>
      <span id="round-label" class="round-label">Round 1 of 5: Baseline</span>
    </header>

    <main class="container">
      <!-- STATUS BAR -->
      <section class="status-bar">
        <div class="status-item">
          <span class="status-title">Time left</span>
          <span id="timer" class="status-value">30</span>
        </div>
        <div class="status-item">
          <span class="status-title">Find next</span>
          <span id="next-number" class="status-value">1</span>
        </div>
        <div class="status-item">
          <span class="status-title">Found</span>
          <span id="found-count" class="status-value">0 / 50</span>
        </div>
        <button id="start-btn" class="btn-primary">Start Round</button>
      </section>

      <!-- INSTRUCTIONS -->
      <section id="instructions" class="instructions">
        <h2>Your workstation</h2>
        <p>Click the cards in order from 1 to 50. You have 30 seconds.</p>
      </section>

      <!-- GAME BOARD -->
      <!-- GAME BOARD -->
      <section id="board" class="board">
        <!-- Cards are generated by script.js -->
      </section>

      <!-- SCOREBOARD -->
      <section class="scoreboard">
        <h2>Results by Round</h2>
        <div class="score-grid">
          <div class="score-box">
            <span class="score-name">Baseline</span
            ><span id="score-1" class="score-value">–</span>
          </div>
          <div class="score-box">
            <span class="score-name">Sort</span
            ><span id="score-2" class="score-value">–</span>
          </div>
          <div class="score-box">
            <span class="score-name">Shine</span
            ><span id="score-3" class="score-value">–</span>
          </div>
          <div class="score-box">
            <span class="score-name">Set in Order</span
            ><span id="score-4" class="score-value">–</span>
          </div>
          <div class="score-box">
            <span class="score-name">Standardize</span
            ><span id="score-5" class="score-value">–</span>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
